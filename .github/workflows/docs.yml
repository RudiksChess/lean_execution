name: Docs

# Browsable API docs (doc-gen4) deployed to GitHub Pages.
# Heavy: generates HTML for the full Mathlib import closure, so this runs only
# on releases and manual dispatch, not on every push.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain + Mathlib cache for the root project.
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true

      - name: Build API docs
        run: |
          cd docbuild
          lake exe cache get
          lake build Thesis:docs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docbuild/.lake/build/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
