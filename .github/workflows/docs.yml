name: Docs

# Browsable API docs (doc-gen4), published to the `gh-pages` branch.
# Heavy: regenerates HTML for the full Mathlib import closure. So it runs ONLY
# when the Lean code changes (or on release / manual dispatch) — never on edits
# to the static pages in web/, which are handled by site.yml in seconds.
on:
  push:
    branches: [main]
    paths:
      - 'Thesis/**'
      - 'Thesis.lean'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - 'docbuild/**'
      - '.github/workflows/docs.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Shared with site.yml so the two never push to gh-pages at the same time.
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true

      - name: Cache generated docs
        uses: actions/cache@v4
        with:
          path: docbuild/.lake/build
          key: docs-${{ runner.os }}-${{ hashFiles('docbuild/lake-manifest.json', 'lean-toolchain') }}-${{ github.sha }}
          restore-keys: |
            docs-${{ runner.os }}-${{ hashFiles('docbuild/lake-manifest.json', 'lean-toolchain') }}-
            docs-${{ runner.os }}-

      - name: Build API docs
        run: |
          cd docbuild
          lake exe cache get
          lake build Thesis:docs

      # Bundle the hand-written static pages so a full rebuild yields a complete site.
      - name: Bundle static pages
        run: cp -r web/. docbuild/.lake/build/doc/

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docbuild/.lake/build/doc
          publish_branch: gh-pages
          keep_files: false
          commit_message: "docs: rebuild API docs + static pages"
