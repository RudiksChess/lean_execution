name: Lean proof verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Kernel-check proofs and audit axioms
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v4

      # Installs the toolchain from lean-toolchain, fetches the Mathlib cache,
      # and runs `lake build` (kernel-checks every proof).
      - name: Build and kernel-check all Lean proofs
        uses: leanprover/lean-action@v1

      # This bridge is a separate root because Foundation and the full Mathlib
      # closure both define Matrix.map and therefore cannot share one module.
      - name: Verify Foundation cross-validation
        run: lake build Thesis.Prop.CompletenessViaFoundation

      # Enforce the policy independently of the committed certificates, then
      # reproduce those certificates and reject drift.
      - name: Axiom audit
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 tools/check_axioms.py
          lake env lean Thesis/Prop/Audit.lean > reports/natural-deduction/audit.txt
          lake env lean Thesis/Sort/Audit.lean  > reports/quicksort/audit.txt
          git diff --exit-code reports/natural-deduction/audit.txt reports/quicksort/audit.txt

      # Produce the literal theorem types, evaluations, and axiom output shown
      # on the public verification page. Drift makes the workflow fail.
      - name: Generate public Lean transcript
        run: |
          make verification-output
          git diff --exit-code web/lean-output.txt

      # The AI cross-validation case study: these standalone proofs must still
      # compile (they are not part of the lake build).
      - name: Verify Aristotle case-study proofs
        run: |
          lake env lean aristotle/NDCore.lean
          lake env lean aristotle/NDFull.lean
          lake env lean aristotle/QuicksortFull.lean

      - name: Upload exact Lean transcript
        uses: actions/upload-artifact@v4
        with:
          name: lean-verification-transcript-${{ github.sha }}
          path: web/lean-output.txt
          if-no-files-found: error
          retention-days: 90

      # Publish a compact, self-contained certificate in the run summary. This
      # step runs only after every verification step above has succeeded.
      - name: Publish verification certificate
        shell: bash
        run: |
          checked_commit="$(git rev-parse HEAD)"
          lean_toolchain="$(tr -d '\r\n' < lean-toolchain)"
          foundation_rev="$(jq -er '.packages[] | select(.name == "Foundation") | .rev' lake-manifest.json)"
          mathlib_rev="$(jq -er '.packages[] | select(.name == "mathlib") | .rev' lake-manifest.json)"

          # Markdown code spans are intentionally literal in the printf strings.
          # shellcheck disable=SC2016
          {
            printf '## Lean formal verification passed\n\n'
            printf 'Every repository proof was kernel-checked, both axiom audits matched their committed certificates, and all standalone Aristotle reconstructions compiled.\n\n'
            printf '| Reproducibility context | Pinned value |\n'
            printf '| --- | --- |\n'
            printf '| Repository commit | [`%s`](%s/%s/commit/%s) |\n' "$checked_commit" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$checked_commit"
            printf '| Lean toolchain | `%s` |\n' "$lean_toolchain"
            printf '| Foundation revision | `%s` |\n' "$foundation_rev"
            printf '| Mathlib revision | `%s` |\n\n' "$mathlib_rev"
            printf '### Checks completed\n\n'
            printf '%s\n' '- `lake build` (all default-target proofs)' '- Foundation cross-validation (`Thesis.Prop.CompletenessViaFoundation`)' '- natural-deduction and quicksort axiom-certificate comparison' '- public theorem/evaluation transcript comparison' '- `aristotle/NDCore.lean`' '- `aristotle/NDFull.lean`' '- `aristotle/QuicksortFull.lean`'
            printf '\n### Lean transcript (actual output)\n\n```text\n'
            cat web/lean-output.txt
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
